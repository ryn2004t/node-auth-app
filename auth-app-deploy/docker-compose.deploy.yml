services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: auth
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: rayanhub/auth-app:backend
    environment:
      DATABASE_URL: postgres://app:app_password@db:5432/auth
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: rayanhub/auth-app:frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data: